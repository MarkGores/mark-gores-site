name: Refresh market snapshot

on:
  schedule:
    # 10:37 UTC Mondays (early morning US Central), after the 5 AM MLS sync.
    - cron: '37 10 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot Prior Lake numbers from priorlake.realestate
        run: python3 scripts/refresh_market.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/market.json; then
            echo "No market changes this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/market.json
          git commit -m "Refresh Prior Lake market snapshot"
          git push
